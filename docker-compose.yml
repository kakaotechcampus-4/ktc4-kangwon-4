# RE:BORN 로컬 개발용 MySQL 전용 docker-compose.
# 합의된 범위대로 이 파일은 DB만 띄웁니다. backend와 Agent는 로컬 Python
# 프로세스 또는 별도 배포 runtime에서 실행하며 이 Compose에 포함하지 않습니다.
# 테스트 DB는 testcontainers를 별도로 사용하되 MySQL 8.0 버전을 맞춥니다.

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: closure_agent
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: # 컨테이너 재시작/재빌드에도 DB 데이터 유지
