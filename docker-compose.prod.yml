# RE:BORN 배포용 docker-compose (EC2에서 실행).
# 루트 docker-compose.yml(로컬 전용, DB만)과는 별개 파일이다 — 그 파일은 건드리지 않는다.
# 필요한 값은 이 파일과 같은 위치의 .env.prod에 채운다(git에는 올리지 않음, .gitignore의 .env.* 규칙으로 이미 제외됨).
# Caddy가 호스트에 설치돼 있어야 한다.
# mysql_health.cnf도 이 파일과 같은 위치에 EC2에서 직접 만든다(git에 올리지 않음) —
# healthcheck가 root 비밀번호를 커맨드라인 인자로 노출하지 않게 하려고 별도 파일로 분리했다.
#   [client]
#   user=root
#   password=<MYSQL_ROOT_PASSWORD와 동일한 값>
# 파일 권한은 chmod 600으로 좁혀둔다.
#
# 실행: docker compose -f docker-compose.prod.yml up -d --build

secrets:
  mysql_health_cnf:
    file: ./mysql_health.cnf

services:
  mysql:
    # 버전을 고정한다. 열어 두면 컨테이너를 새로 만들 때 그때 최신판이 깔려 테스트한 버전과 갈린다.
    # 지금 운영보다 낮추면 안 된다(데이터 폴더를 낮은 버전으로 되돌리지 못해 DB가 안 뜬다).
    # 바꿀 때는 docker-compose.yml과 backend/app/be/db.py의 MYSQL_IMAGE도 같이 바꾼다.
    image: mysql:8.0.46
    restart: always
    environment:
      MYSQL_DATABASE: closure_agent
      # DB에는 한국 시각을 저장한다. created_at·updated_at은 DB가 값을 넣으므로
      # 컨테이너 시간대를 맞춰야 파이썬이 넣는 값(kst_now)과 기준이 어긋나지 않는다.
      # env_file보다 environment가 우선이라 .env.prod에 TZ가 있든 없든 이 값이 쓰인다.
      TZ: Asia/Seoul
    env_file:
      - .env.prod
    secrets:
      - mysql_health_cnf
    ports:
      - "127.0.0.1:3306:3306" # 외부 인터넷 노출 안 함 — 보안그룹에서도 3306은 열지 않는다
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "--defaults-extra-file=/run/secrets/mysql_health_cnf", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reborn_net

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 빌드한 커밋을 /health에 싣는다. 배포 명령이 GIT_SHA를 넘기고, 빠뜨리면 unknown으로 뜬다(docs/deploy.md)
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8000:8000" # 외부에 직접 노출하지 않음 — Caddy가 80/443에서 받아 이 포트로 리버스 프록시
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - document_data:/data/documents # 사장님이 올린 서류·점검 결과. 재빌드해도 남아야 한다
    depends_on:
      mysql:
        condition: service_healthy # 컨테이너 기동이 아니라 접속 가능 상태까지 대기
    networks:
      - reborn_net

networks:
  reborn_net:

volumes:
  mysql_data: # 컨테이너 재시작/재빌드에도 DB 데이터 유지
  document_data: # 서류 폴더(AGENT_DOCUMENT_DIR). 지우면 서류 목록·제출 파일이 사라진다
