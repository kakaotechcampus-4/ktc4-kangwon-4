# RE:BORN 배포용 docker-compose (EC2에서 실행).
# 루트 docker-compose.yml(로컬 전용, DB만)과는 별개 파일이다 — 그 파일은 건드리지 않는다.
# 필요한 값은 이 파일과 같은 위치의 .env.prod에 채운다(git에는 올리지 않음, .gitignore의 .env.* 규칙으로 이미 제외됨).
#
# 실행: docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:3306:3306" # 외부 인터넷 노출 안 함 — 보안그룹에서도 3306은 열지 않는다
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reborn_net

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    ports:
      - "0.0.0.0:80:8000" # 외부 접근 허용
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy # 컨테이너 기동이 아니라 접속 가능 상태까지 대기
    networks:
      - reborn_net

networks:
  reborn_net:

volumes:
  mysql_data: # 컨테이너 재시작/재빌드에도 DB 데이터 유지
