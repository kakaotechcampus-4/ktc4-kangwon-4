name: BE·Agent CI

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/sql/**"
      - "docker-compose*.yml"
      - "backend/requirements*.txt"
      - ".github/workflows/be-agent-ci.yml"
  # PR에서 통과해도 머지한 결과(develop)가 깨질 수 있다. 다른 PR이 먼저 들어가 둘이 함께 깨지는 경우다.
  # 경로는 위 pull_request와 같게 둔다. 한쪽에만 더하면 그 파일만 바뀐 머지는 검사 없이 들어간다.
  push:
    branches: [develop]
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/sql/**"
      - "docker-compose*.yml"
      - "backend/requirements*.txt"
      - ".github/workflows/be-agent-ci.yml"

concurrency:
  # PR은 새 커밋이 오면 앞 검사가 필요 없어서 브랜치마다 하나만 남긴다. develop은 머지마다 결과가 남아야 해서
  # 커밋마다 따로 둔다. 같은 묶음에 두면 연달아 머지할 때 기다리던 검사가 밀려 사라진다.
  group: be-agent-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      # BE 라우터를 불러오는 모의 테스트에만 쓰는 설정이다.
      ENVIRONMENT: dev
      DATABASE_URL: "sqlite://"
      KAKAO_CLIENT_ID: mock-client
      KAKAO_CLIENT_SECRET: mock-secret
      KAKAO_REDIRECT_URI: "http://localhost/callback"
      JWT_SECRET_KEY: mock-jwt-secret-for-agent-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/app/agent/document_tool/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r app/agent/document_tool/requirements.txt
      - name: Prepare local document OCR
        run: python scripts/setup_agent_ocr.py
      - name: Run mocked Agent regression tests
        # LLM 평가 스크립트는 실행하지 않는다.
        run: python -m pytest tests -q
