name: BE·Agent CI

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/scripts/**"
      - "backend/sql/**"
      - "docker-compose*.yml"
      - "backend/requirements*.txt"
      - "docs/developers/generated/**"
      - ".github/workflows/be-agent-ci.yml"

concurrency:
  group: be-agent-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      # BE 라우터를 불러오는 모의 테스트에만 쓰는 설정이다.
      ENVIRONMENT: dev
      DATABASE_URL: "sqlite://"
      KAKAO_CLIENT_ID: mock-client
      KAKAO_CLIENT_SECRET: mock-secret
      KAKAO_REDIRECT_URI: "http://localhost/callback"
      JWT_SECRET_KEY: mock-jwt-secret-for-agent-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/app/agent/document_tool/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r app/agent/document_tool/requirements.txt
      - name: Prepare local document OCR
        run: python scripts/setup_agent_ocr.py
      - name: Check exported documentation contracts
        run: python scripts/export_documentation.py --check
      - name: Run mocked Agent regression tests
        # LLM 평가 스크립트는 실행하지 않는다.
        run: python -m pytest tests -q
