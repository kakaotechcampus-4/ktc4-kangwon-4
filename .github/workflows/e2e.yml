name: E2E

# 진짜 FE(빌드본) · 진짜 BE · 진짜 MySQL로 브라우저에서 핵심 흐름 하나를 돈다(frontend/e2e).
# 모델은 부르지 않는다 — backend/tests/e2e_server.py가 모델 자리에만 가짜를 끼운다.
# 브라우저까지 띄워 몇 분 걸려서, 화면이나 서버 코드가 바뀔 때만 돈다.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "backend/requirements*.txt"
      - "backend/tests/e2e_server.py"
      - ".github/workflows/e2e.yml"
  # PR마다 통과해도 함께 머지한 결과가 깨질 수 있다
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "backend/requirements*.txt"
      - "backend/tests/e2e_server.py"
      - ".github/workflows/e2e.yml"

concurrency:
  # be-agent-ci.yml과 같은 이유로 PR은 브랜치마다, develop은 커밋마다 묶는다
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        # 운영과 같은 버전(backend/app/be/db.py MYSQL_IMAGE). 켤 때 표를 지우는 전용 DB다
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_DATABASE_URL: "mysql+pymysql://root:e2e@127.0.0.1:3306/e2e?charset=utf8mb4"
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/app/agent/document_tool/requirements.txt
      # 서버를 불러오는 데 필요한 것만. 서류 OCR은 이 흐름에서 쓰지 않아 언어 파일은 받지 않는다
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r app/agent/document_tool/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
