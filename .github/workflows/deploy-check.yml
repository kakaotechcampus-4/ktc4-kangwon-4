# 자동 배포를 붙이기 전에, GitHub Actions가 운영 EC2에 닿는지만 확인한다.
#
# 부트캠프가 팀마다 만들어 둔 ktc-github-deploy 역할로 로그인하고(액세스 키 없음),
# Session Manager로 EC2에 "읽기만 하는" 명령을 보낸다. 서버의 코드·컨테이너·DB는 바꾸지 않는다.
# 확인이 끝나면 이 파일은 배포 워크플로로 바꾸거나 지운다.
name: Deploy check

on:
  push:
    branches: [chore/deploy-oidc-check]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 토큰 발급. 빠지면 AWS 로그인이 실패한다
  contents: read

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-0c5333a2eb9116601

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: AWS 로그인 (ktc-github-deploy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 누구로 로그인됐는지
        run: aws sts get-caller-identity --query Arn --output text

      - name: EC2에 읽기 명령 보내기
        id: send
        run: |
          # 무엇이 떠 있는지 보기만 한다
          REMOTE='cd /home/ubuntu/app
          hostname
          git log --oneline -1
          docker compose -f docker-compose.prod.yml ps --format "{{.Name}} {{.Status}}"
          curl -s -m 10 https://reborn-ktc.duckdns.org/health || true'
          PARAMS=$(jq -n --arg s "$REMOTE" '{commands: [$s]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-check ${GITHUB_SHA:0:7}" \
            --timeout-seconds 60 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: 결과 기다리고 출력
        run: |
          for _ in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "상태: $STATUS"
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          [ "$STATUS" = Success ]
